# Nginx configuration for dpulibrary.space
# Handles SSL, Frontend SPA, Backend Reverse Proxy, Cover Images, and Google OAuth Callbacks

server {
    listen 80;
    listen [::]:80;
    server_name dpulibrary.space www.dpulibrary.space api.dpulibrary.space;

    # Let's Encrypt SSL challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dpulibrary.space www.dpulibrary.space;

    # SSL Certificates (Managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/dpulibrary.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dpulibrary.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root directory for Vite React Production Build
    root /var/www/dpulibrary/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. API Reverse Proxy to Axum Backend (Port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Health check proxy
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Static Cover Images with Long-term Cache
    location /covers/ {
        alias /var/www/dpulibrary/frontend/public/covers/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 4. Firebase Auth Handler endpoint
    location /__/auth/ {
        proxy_pass https://dpu-library-auth.firebaseapp.com;
        proxy_set_header Host dpu-library-auth.firebaseapp.com;
    }

    # 5. Frontend Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
