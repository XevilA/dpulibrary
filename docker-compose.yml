version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 15 Database (Auto-seeds DPU 138 theses)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: elib_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elib_secret}
      POSTGRES_DB: ${POSTGRES_DB:-elib_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elib} -d ${POSTGRES_DB:-elib_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - coolify

  # ─────────────────────────────────────────────
  # Redis 7 In-Memory Cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: elib_redis
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - coolify

  # ─────────────────────────────────────────────
  # Rust / Axum Backend API (Port 3333 on host, 3000 in container)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elib_backend
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-elib}:${POSTGRES_PASSWORD:-elib_secret}@postgres:5432/${POSTGRES_DB:-elib_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dpu_library_super_secret_jwt_key_2026_production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      WORKER_INTERVAL_SECS: 30
      RUST_LOG: info
      ALLOWED_ORIGINS: "*"
    ports:
      - "3333:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elib-backend.rule=Host(`api.dpulibrary.space`)"
      - "traefik.http.routers.elib-backend.entrypoints=https"
      - "traefik.http.routers.elib-backend.tls=true"
      - "traefik.http.routers.elib-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.elib-backend.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - coolify

volumes:
  postgres_data:
  redis_data:

networks:
  default:
  coolify:
    external: true
