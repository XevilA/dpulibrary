version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 15 Database (Auto-seeds DPU 138 theses)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: elib_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elib_secret}
      POSTGRES_DB: ${POSTGRES_DB:-elib_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elib} -d ${POSTGRES_DB:-elib_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Redis 7 In-Memory Cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: elib_redis
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Rust / Axum Backend API (Port 3000)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elib_backend
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-elib}:${POSTGRES_PASSWORD:-elib_secret}@postgres:5432/${POSTGRES_DB:-elib_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dpu_library_super_secret_jwt_key_2026_production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      WORKER_INTERVAL_SECS: 30
      RUST_LOG: info
      ALLOWED_ORIGINS: "*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
